# Monorepo CI: her uygulama kendi işinde, kendi dizininde. Kurulum kökte tek seferlik
# (`bun install` tüm workspace'leri kökteki node_modules'a kurar, bkz. bunfig.toml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Aynı dal için üst üste gelen çalışmaları iptal et.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# RUNNER_LINUX: repo/org düzeyinde `vars.RUNNER_LINUX` tanımlıysa self-hosted runner kullanılır.
# bun sürümü bilerek sabit (gerekçe: self-hosted runner'da `ETXTBSY`); kök package.json
# `packageManager` alanıyla aynı tutulmalı.
jobs:
  web:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # `--frozen-lockfile`: kilitli sürümlerden sapma varsa CI kırmızı döner.
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Tip denetimi (astro check)
        run: bun run check
      # `bun test` (boşluklu) bun'un kendi runner'ıdır, vitest'in `vi.*` global'lerini tanımaz.
      - name: Testler (vitest)
        run: bun run test
      - name: Format denetimi (prettier)
        run: bun run format:check
      - name: Build
        run: bun run build

  api:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
        working-directory: .
      - name: Tip denetimi
        run: bun run check
      # Testler Workers çalışma zamanında (Miniflare) ve yerel D1 üstünde koşar; ağa çıkmaz.
      - name: Testler
        run: bun run test

  shared-and-mobile:
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Ortak paket (tip + test)
        working-directory: packages/shared
        run: bun run check && bun run test
      - name: Mobil (tip + lint)
        working-directory: apps/mobile
        run: bun run check && bun run lint
